        };

        // Music Control Component
        const MusicControl = () => {
            const [isPlaying, setIsPlaying] = useState(false);
            const [isReady, setIsReady] = useState(false);

            useEffect(() => {
                const a = getBgAudio();
                if (!a) return;
                setIsReady(true);
                if (!a.paused) setIsPlaying(true);
                const onPlay = () => setIsPlaying(true);
                const onPause = () => setIsPlaying(false);
                a.addEventListener('play', onPlay);
                a.addEventListener('playing', onPlay);
                a.addEventListener('pause', onPause);
                return () => {
                    a.removeEventListener('play', onPlay);
                    a.removeEventListener('playing', onPlay);
                    a.removeEventListener('pause', onPause);
                };
            }, []);

            const toggleMusic = () => {
                const a = getBgAudio();
                if (!a) return;
                if (isPlaying) {
                    a.pause();
                    setIsPlaying(false);
                } else {
                    a.play().catch(e => console.warn(e));
                    setIsPlaying(true);
                }
            };

            if (!isReady) return null;

            return (
                <div className="music-control">
                    <button
                        onClick={toggleMusic}
                        className="group relative w-14 h-14 rounded-full bg-primary/20 backdrop-blur-md border border-primary/40 flex items-center justify-center hover:bg-primary/30 transition-all duration-300 hover:scale-110"
                    >
                        <span className="material-symbols-outlined text-primary text-2xl">
                            {isPlaying ? 'pause' : 'play_arrow'}
                        </span>
                        <div className="absolute inset-0 rounded-full bg-primary/10 animate-pulse-glow"></div>
                    </button>
                    <div className="text-center mt-2">
                        <p className="text-[8px] text-ink-muted font-micro tracking-wider opacity-60">
                            {isPlaying ? 'NOW PLAYING' : 'PAUSED'}
                        </p>
                    </div>
                </div>
            );
        };

        // App Screens Enum
        const AppScreen = {
            COVER: 'COVER',
            JOURNAL: 'JOURNAL',
            CONSTELLATION: 'CONSTELLATION',
            SIGN_OFF: 'SIGN_OFF',
        };

        // Envelope Component
        const Envelope = ({ onOpen }) => {
            const [isOpening, setIsOpening] = useState(false);

            const handleOpen = () => {
                setIsOpening(true);
                playBackgroundMusic();
                setTimeout(() => {
                    onOpen();
                }, 1500);
            };

            return (
                <div className={`h-screen w-full flex items-center justify-center transition-opacity duration-1000 ${isOpening ? 'opacity-0 scale-150' : 'opacity-100'}`}>

                            <div className="absolute inset-0 bg-gradient-to-br from-primary/5 via-transparent to-black/60 rounded-sm pointer-events-none"></div>
                            
                            <div className="absolute top-0 left-0 w-full h-full pointer-events-none">
                                <svg className="opacity-30 stroke-ink-muted fill-transparent" height="100%" width="100%" preserveAspectRatio="none">
                                    <path d="M0 0 L240 160 L480 0" strokeWidth="1" className="md:block hidden" />
                                    <path d="M0 320 L240 160 L480 320" strokeWidth="1" className="md:block hidden" />
                                    <path d="M0 0 L170 120 L340 0" strokeWidth="1" className="md:hidden block" />
                                    <path d="M0 240 L170 120 L340 240" strokeWidth="1" className="md:hidden block" />
                                </svg>
                            </div>

                            <div className="relative z-10 mb-8 transform -rotate-2 text-center">
                                <h1 className="font-script text-4xl md:text-6xl text-ink tracking-wide drop-shadow-md opacity-90">
                                    Untuk Cintaku
                                </h1>
                                <p className="font-micro text-[10px] md:text-xs text-primary mt-2 tracking-[0.3em] uppercase opacity-60">

                                </p>
                            </div>
